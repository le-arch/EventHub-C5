version: "2"
sql:
- schema: "./migrations"
  queries: "./queries"
  engine: "postgresql"
  gen:
    go:
      package: "repo"
      out: "./repo"
      sql_package: "pgx/v5"
      emit_json_tags: true
      emit_interface: true
      emit_empty_slices: true
      emit_exact_table_names: false
      emit_pointers_for_null_types: true
      overrides:
        - db_type: "uuid"
          go_type:
            import: "github.com/google/uuid"
            package: "uuid"
            type: "UUID"
        - db_type: "uuid"
          nullable: true
          go_type:
            import: "github.com/google/uuid"
            package: "uuid"
            type: "UUID"
            pointer: true
        - db_type: "date"
          go_type:
            import: "time"
            type: "Time"
        - db_type: "date"
          nullable: true
          go_type:
            import: "time"
            type: "Time"
            pointer: true
        - db_type: "timestamptz"
          go_type:
            import: "time"
            type: "Time"
        - db_type: "timestamptz"
          nullable: true
          go_type:
            import: "time"
            type: "Time"
            pointer: true
        - db_type: "text"
          nullable: true
          go_type: "string"
        - db_type: "pg_catalog.time"
          go_type: "string"
        - db_type: "pg_catalog.time"
          nullable: true
          go_type: "string"
        - column: "events.capacity_range"
          go_type:
            import: "github.com/jackc/pgx/v5/pgtype"
            type: "Range[pgtype.Int4]"
            pointer: true
        - column: "events.start_time"
          go_type:
            type: "string"
            pointer: true
        - column: "events.end_time"
          go_type:
            type: "string"
            pointer: true
        
        
